name: Node.js CI

on:
  push:
    branches: [main, develop, deploy]
  pull_request:
    branches: [main, develop, deploy]

jobs:
  build:
    runs-on: [self-hosted, Linux, X64]
    strategy:
      matrix:
        node-version: [18.x, 20.x, 22.x]
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
      - run: npm ci
      - run: npm run build --if-present

  test:
    runs-on: [self-hosted, Linux, X64]
    needs: build
    steps:
      - uses: actions/checkout@v4
      - name: Use Node.js 20.x
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
      - run: npm ci
      - run: npm test -- --testPathIgnorePatterns=e2e/

  e2e:
    runs-on: [self-hosted, linux, x64]
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20.x, cache: 'npm' }

      - name: Instala dependencias
        run: npm ci
      - name: Instala Chrome (para Selenium)
        run: |
          sudo yum update -y
          sudo yum install -y google-chrome-stable

      # --- Levanta Vite y espera ---
      - name: Arranca Vite en background
        run: npm run dev -- --host &
      
      - name: Espera a que Vite responda
        run: |
          for i in {1..30}; do
            if curl -s --head http://localhost:5173 | grep "200 OK" > /dev/null; then
              echo "Vite está listo"; exit 0; fi
            sleep 2
          done
          echo "Vite no respondió en 60 s"; exit 1

      # --- Ejecuta tests E2E ---
      - name: Ejecuta Selenium (E2E)
        run: npm test -- e2e/
        env:
          CI: true

  deploy:
    runs-on: [self-hosted, Linux, X64]
    needs: [test, build, e2e]
    steps:
      - uses: actions/checkout@v4
      - run: npm ci
      - run: npm run build
      - name: Copia el build al directorio público de Nginx
        run: |
          sudo rm -rf /var/www/my-react-app/*
          sudo cp -r dist/* /var/www/my-react-app/
      - name: Reinicia nginx
        run: sudo systemctl reload nginx
